elevation_costmap_node:
  ros__parameters:
    # Frames / topics
    frame_id: base_link
    pointcloud_topic: /livox/lidar
    scan_topic: /scan

    # Elevation grid
    grid_size: 6.0          # [m] square side length (robot-centered)
    resolution: 0.05        # [m] cell size

    # Obstacle detection
    max_delta_h: 0.03       # [m] Δh above this → obstacle cell
    min_points: 3           # ignore cells with fewer points
    enable_slope_correction: true
    max_slope_deg: 12.0     # continuous slope below this is not an obstacle

    # LaserScan output
    scan:
      angle_min: -3.14159265359
      angle_max: 3.14159265359
      angle_increment_deg: 1.0
      range_min: 0.1
      range_max: 2.83

    # Point-cloud ROI in frame_id [m]
    roi:
      x_min: -2.0
      x_max: 2.0
      y_min: -2.0
      y_max: 2.0
      z_min: -0.5
      z_max: 1.5

    # Self-filter AABBs in frame_id [m] (x+: forward)
    self_filter:
      robot:                 # robot body / mount
        enable: true
        x_min: -0.40
        x_max: 0.05
        y_min: -0.30
        y_max: 0.30
        z_min: -0.1
        z_max: 0.8
      operator:              # trailing operator behind the robot
        enable: true
        x_min: -1.80
        x_max: -0.40
        y_min: -0.60
        y_max: 0.60
        z_min: -0.1
        z_max: 1.8

    tf_timeout: 0.05        # [s]
